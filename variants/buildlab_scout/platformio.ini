[BuildLab_Scout]
extends = esp32_base
; BuildLab Scout: Waveshare ESP32-S3-Zero + E22-900M30S (ported from Meshtastic
; esp32s3-zero_E22_900m_30S). Hardware differs from the original vendor board.
board = esp32-s3-zero
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/buildlab_scout
  -D BUILDLAB_SCOUT
  -D P_LORA_DIO_1=45
  -D P_LORA_NSS=18
  -D P_LORA_RESET=41
  -D P_LORA_BUSY=42
  -D P_LORA_SCLK=38
  -D P_LORA_MISO=40
  -D P_LORA_MOSI=39
  -D SX126X_TXEN=3
  -D SX126X_RXEN=17
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=6
  -D PIN_BUZZER=10
  -D PIN_BOARD_SDA=11
  -D PIN_BOARD_SCL=12
  -D BATTERY_ADC_MULTIPLIER=2.08f

  ; GPS (u-blox): ESP RX=GPIO7 @38400; EN=GPIO9 driven in BuildLabScoutBoard::begin().
  -D PIN_GPS_TX=7
  -D PIN_GPS_RX=8
  -D PIN_GPS_EN=9
  -D GPS_BAUD_RATE=38400
  -D ENV_SKIP_GPS_DETECT=1
  -D UI_SENSORS_PAGE=1   ; страница сенсоров на дисплее (нужна при включённых сенсорах в этом форке)

  ; E22-900M30S uses external TXEN/RXEN RF switch -> DIO2_AS_RF_SWITCH NOT set.
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/buildlab_scout>
  +<helpers/sensors>
  +<helpers/ui/buzzer.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  end2endzone/NonBlockingRTTTL@^1.3.0

; Encoder (A=GPIO5, B=GPIO4 - order gives CW = next; press = GPIO6 = PIN_USER_BTN) and 6 status LEDs on GPIO13.
; Used by the companion UI only. Encoder: turn = scroll, short press = enter, long = back.
[BuildLab_Scout_ui_hw]
build_flags =
  -D UI_HAS_ROTARY_INPUT
  -D UI_ENCODER_NAV
  -D PIN_ENCODER_A=5
  -D PIN_ENCODER_B=4
  -D UI_HAS_STATUS_LEDS
  -D PIN_STATUS_LEDS=13
  -D STATUS_LEDS_COUNT=6
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0

; === BuildLab Scout environments ===
[env:BuildLab_Scout_repeater]
extends = BuildLab_Scout
board_build.partitions = huge_app.csv   ; 3MB app (без OTA) — south_edition не влезает в дефолтные 1.25MB
build_flags =
  ${BuildLab_Scout.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Scout Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${BuildLab_Scout.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${BuildLab_Scout.lib_deps}
  ${esp32_ota.lib_deps}

[env:BuildLab_Scout_terminal_chat]
extends = BuildLab_Scout
build_flags =
  ${BuildLab_Scout.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${BuildLab_Scout.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${BuildLab_Scout.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:BuildLab_Scout_room_server]
extends = BuildLab_Scout
board_build.partitions = huge_app.csv   ; 3MB app (без OTA) — south_edition не влезает в дефолтные 1.25MB
build_flags =
  ${BuildLab_Scout.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Scout Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${BuildLab_Scout.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_room_server>
lib_deps =
  ${BuildLab_Scout.lib_deps}
  ${esp32_ota.lib_deps}

[env:BuildLab_Scout_companion_radio_usb]
extends = BuildLab_Scout
build_flags =
  ${BuildLab_Scout.build_flags}
  ${BuildLab_Scout_ui_hw.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
  -D CYRILLIC_SUPPORT=1
build_src_filter = ${BuildLab_Scout.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${BuildLab_Scout.lib_deps}
  ${BuildLab_Scout_ui_hw.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:BuildLab_Scout_companion_radio_ble]
extends = BuildLab_Scout
board_build.partitions = huge_app.csv   ; 3MB app (без OTA) — south_edition не влезает в дефолтные 1.25MB
build_flags =
  ${BuildLab_Scout.build_flags}
  ${BuildLab_Scout_ui_hw.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
; Энергосбережение: PS-ядро и флаги из [esp32_ps]; ядро ставится один раз:
; python tools/ps_framework.py
  ${esp32_ps.build_flags}
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D CYRILLIC_SUPPORT=1
platform_packages = ${esp32_ps.platform_packages}
build_src_filter = ${BuildLab_Scout.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${BuildLab_Scout.lib_deps}
  ${BuildLab_Scout_ui_hw.lib_deps}
  densaugeo/base64 @ ~1.4.0

; === BuildLab Scout with Ebyte E22P-868M30S ===
; Same board; only the radio front-end control differs. On the E22P, module pin 6 (GPIO17)
; is EN (front-end enable, held HIGH) and pin 7 (GPIO3) is T/R CTRL (HIGH = TX, LOW = RX).
; Driving GPIO17 as RXEN, as the E22 envs do, would switch the front end OFF during TX.
[env:BuildLab_Scout_E22P_repeater]
extends = env:BuildLab_Scout_repeater
build_unflags = -D SX126X_RXEN=17
build_flags = ${env:BuildLab_Scout_repeater.build_flags} -D P_LORA_RF_EN=17

[env:BuildLab_Scout_E22P_terminal_chat]
extends = env:BuildLab_Scout_terminal_chat
build_unflags = -D SX126X_RXEN=17
build_flags = ${env:BuildLab_Scout_terminal_chat.build_flags} -D P_LORA_RF_EN=17

[env:BuildLab_Scout_E22P_room_server]
extends = env:BuildLab_Scout_room_server
build_unflags = -D SX126X_RXEN=17
build_flags = ${env:BuildLab_Scout_room_server.build_flags} -D P_LORA_RF_EN=17

[env:BuildLab_Scout_E22P_companion_radio_usb]
extends = env:BuildLab_Scout_companion_radio_usb
build_unflags = -D SX126X_RXEN=17
build_flags = ${env:BuildLab_Scout_companion_radio_usb.build_flags} -D P_LORA_RF_EN=17

[env:BuildLab_Scout_E22P_companion_radio_ble]
extends = env:BuildLab_Scout_companion_radio_ble
build_unflags = -D SX126X_RXEN=17
build_flags = ${env:BuildLab_Scout_companion_radio_ble.build_flags} -D P_LORA_RF_EN=17
